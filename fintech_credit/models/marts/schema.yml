version: 2

models:
  - name: dim_clientes
    description: "Dimensión Clientes Gold: Deduplicada (SCD2 resuelto con versión más reciente)"
    columns:
      - name: id_cliente
        description: "Clave primaria única del cliente"
        tests:
          - not_null
          - unique
      - name: score_bancario
        description: "Score crediticio del cliente en su última actualización"
        tests:
          - not_null

  - name: fct_prestamos
    description: "Tabla de Hechos Gold: Solicitudes de crédito, saldos, estado de mora e indicadores de riesgo"
    columns:
      - name: id_solicitud
        description: "Clave primaria del hecho (1 fila = 1 crédito)"
        tests:
          - not_null
          - unique
      - name: id_cliente
        description: "Clave foránea hacia dim_clientes"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: id_cliente
      - name: id_canal
        description: "Clave foránea hacia dim_canales (mapeado a -1 si es desconocido)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_canales')
                field: id_canal
      - name: monto_otorgado
        tests:
          - not_null

  - name: dim_canales
    description: "Dimensión Canales Gold: Catálogo de originación con fila comodín -1 para huérfanos"
    columns:
      - name: id_canal
        description: "Clave primaria del canal"
        tests:
          - not_null
          - unique

  - name: dim_calendario
    description: "Dimensión Calendario Gold: Eje temporal generado dinámicamente para análisis de cohortes y vintage"
    columns:
      - name: fecha_key
        description: "Clave primaria única de la fecha (DATE)"
        tests:
          - not_null
          - unique
      - name: anio
        description: "Año numérico"
        tests:
          - not_null
      - name: anio_mes
        description: "Formato YYYY-MM para agrupación por cohortes (Vintage Analysis)"
        tests:
          - not_null
  - name: fct_pagos_cuotas
    description: "Tabla de Hechos Transaccional Gold: Cuotas, fechas de vencimiento, cobros reales y flags de mora por cuota"
    columns:
      - name: id_pago
        description: "Clave primaria única del pago/cuota"
        tests:
          - not_null
          - unique
      - name: id_solicitud
        description: "Clave foránea hacia fct_prestamos"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_prestamos')
                field: id_solicitud
      - name: id_cliente
        description: "Clave foránea hacia dim_clientes"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: id_cliente
      - name: id_canal
        description: "Clave foránea hacia dim_canales"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_canales')
                field: id_canal
      - name: monto_cuota
        tests:
          - not_null
